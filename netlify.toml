[build]
  command = "npm install && npm run build"
  publish = "dist"

[functions."refresh-news-feed"]
  # 15:00 UTC = 11:00am ET during EDT (UTC-4). Shift to "0 16 * * *" (11:00am EST, UTC-5)
  # once daylight saving ends in November, and back to "0 15 * * *" when it resumes in March.
  schedule = "0 15 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
